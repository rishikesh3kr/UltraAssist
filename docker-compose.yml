
services:
# LiteLLM Proxy (Bedrock / LLM Gateway)
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: ultraassist_litellm
    ports:
      - "4001:4001"
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION_NAME=${AWS_REGION_NAME:-eu-central-1}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-1234}
    volumes:
      - ./litellm_config.yaml:/app/config.yaml
      - ${USERPROFILE}/.aws:/root/.aws:ro
    command: --config /app/config.yaml --port 4001
    restart: unless-stopped
    networks:
      - ultraassist_network

# RAG Service (Multi-department)
  rag-service:
    build:
      context: .
      dockerfile: Dockerfile.rag
    container_name: ultraassist_rag_service
    ports:
      - "8020:8020"
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}
      - AWS_REGION_NAME=${AWS_REGION_NAME:-us-east-1}
      - ENABLE_IMAGE_SEMANTICS=${ENABLE_IMAGE_SEMANTICS:-true}
      - ENABLE_MANUAL_IMAGE_SEMANTICS=${ENABLE_MANUAL_IMAGE_SEMANTICS:-false}
      - BEDROCK_VISION_MODEL=${BEDROCK_VISION_MODEL:-us.anthropic.claude-sonnet-4-20250514-v1:0}
    volumes:
      - ./chunks_db:/app/chunks_db
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - ultraassist_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8020/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

# OpenWebUI (Frontend + Routing Layer)
  open-webui:
    build:
      context: .
      dockerfile: Dockerfile.openwebui
    container_name: ultraassist_open_webui
    ports:
      - "3001:8080"
    environment:
      - OPENAI_API_BASE_URLS=http://litellm:4001/v1
      - OPENAI_API_KEYS=${LITELLM_MASTER_KEY:-sk-1234}
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-change-this-secret-key}
      - ALLOWED_IFRAME_URIs=about:srcdoc
      - ENABLE_FUNCTIONS=true
      - RAG_SERVICE_URL=http://rag-service:8020
      - USER_AGENT=UltraAssist
      - CORS_ALLOW_ORIGIN=http://localhost:3001
    volumes:
      - open_webui_data:/app/backend/data
      - ./data:/app/data
      - ./functions:/app/backend/functions
      - ./output:/app/backend/docx_output
      - ./static:/app/backend/static
    restart: unless-stopped
    depends_on:
      - litellm
      - rag-service
    networks:
      - ultraassist_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  open_webui_data:
    driver: local

networks:
  ultraassist_network:
    driver: bridge
